name: Dependency audit

# Catches known
# vulnerabilities in this repo's resolved dependencies, and catches a
# requirements/*.lock.txt file that's drifted out of sync with
# pyproject.toml. Runs on every push/PR that touches a dependency manifest,
# and once a week regardless of code changes -- a dependency already merged
# and unchanged here can still grow a newly disclosed CVE.
#
# Severity policy:
#   - Python runtime dependencies (requirements/runtime.lock.txt -- what
#     `pip install privacyfence` actually installs, and what PyInstaller
#     bundles into the .app) are audited with pip-audit and BLOCK the job on
#     any known vulnerability, at any severity. There's no per-severity cutoff
#     here because OSV, pip-audit's data source, doesn't consistently carry a
#     normalized severity score across every Python advisory the way GitHub's
#     npm advisory database does -- "does a known-vulnerable version resolve
#     at all" is the gate. Should a future finding have no fix released yet
#     and be assessed as not exploitable in how this codebase uses the
#     package, the accepted-risk exception mechanism is `pip-audit
#     --ignore-vuln <ID>`, added to the blocking step below with a comment
#     saying why -- not used anywhere in this workflow today.
#   - Python dev/test-only dependencies (requirements/dev.lock.txt) are
#     audited too, but informationally -- they run in CI and on contributors'
#     machines, never on an end user's, so a finding there is worth seeing
#     but not worth blocking every unrelated PR over.
#   - The Node shim's runtime dependency (mcpb/shim/package.json's
#     `dependencies`, the only ones bundled into the shipped .mcpb --
#     `devDependencies` are build/test-only) is audited with
#     `npm audit --omit=dev` and BLOCKS on high or critical; moderate/low
#     findings are reported by the same command's exit status but don't fail
#     the job -- see the "informational" step below.
on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements/*.lock.txt"
      - "mcpb/shim/package.json"
      - "mcpb/shim/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/*.lock.txt"
      - "mcpb/shim/package.json"
      - "mcpb/shim/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # 07:00 UTC every Monday -- independent of any commit, so a newly
    # published CVE against an unchanged pin still gets caught within a week.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-freshness:
    # Guards the "locked dependency set" itself: a pyproject.toml dependency
    # bump (by hand, or landed via a Dependabot PR that only touches the
    # manifest) that didn't also run
    # scripts/update_dependency_locks.sh leaves requirements/*.lock.txt
    # resolving something other than what's actually pinned -- which quietly
    # defeats both the hash-pinned install and the pip-audit job below,
    # since neither would be looking at the real dependency set any more.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Regenerate lock files into a scratch copy
        run: |
          mkdir -p /tmp/lockcheck
          pip-compile --generate-hashes --allow-unsafe \
            --output-file=/tmp/lockcheck/runtime.lock.txt pyproject.toml
          pip-compile --generate-hashes --allow-unsafe \
            --extra dev --extra test --extra lint \
            --output-file=/tmp/lockcheck/dev.lock.txt pyproject.toml

      # Ignores every top-level `#...` line (pip-compile's own autogenerated
      # header, always the first few lines of both files) rather than doing
      # a byte-exact diff: that header embeds the compiling Python's own
      # minor version, which legitimately differs between this job's 3.13
      # and whatever a contributor last ran
      # scripts/update_dependency_locks.sh with locally, without the
      # dependency set itself having changed at all. The indented `# via
      # ...` provenance comments under each package aren't top-level and
      # stay in the comparison.
      - name: Diff against committed lock files
        run: |
          for name in runtime dev; do
            committed="requirements/${name}.lock.txt"
            fresh="/tmp/lockcheck/${name}.lock.txt"
            diff -u <(grep -v '^#' "$committed") <(grep -v '^#' "$fresh") \
              || { echo "::error::${committed} is stale -- run scripts/update_dependency_locks.sh and commit the result" >&2; exit 1; }
          done

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies (blocking)
        run: pip-audit --strict -r requirements/runtime.lock.txt

      - name: Audit dev/test dependencies (informational)
        if: always()
        continue-on-error: true
        run: pip-audit --strict -r requirements/dev.lock.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcpb/shim/package-lock.json

      - name: Install shim dependencies
        run: npm ci
        working-directory: mcpb/shim

      - name: Audit shim runtime dependencies (blocking - high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: mcpb/shim

      - name: Audit shim runtime dependencies (informational - full report)
        if: always()
        run: npm audit --omit=dev || true
        working-directory: mcpb/shim
