name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  test:
    # P10 (docs/https-connector-refactor-plan.md §12, D6) deleted the last
    # AppKit-tainted code in this repo -- the native menu bar/approval
    # dialogs/settings window -- so nothing here depends on real AppKit/
    # PyObjC behavior any more, and the whole suite is platform-independent.
    # rumps/pyobjc-framework-* are optional extras now (pyproject.toml's
    # `macos-native` group), never installed here. Runs on ubuntu-latest
    # for the same reason any other platform-independent Python project
    # would: it's the cheaper, faster runner, and there's no longer a
    # platform split to test across two jobs. Building/signing the actual
    # macOS .app/.dmg is still macOS-only, and still covered separately by
    # build.yml on a real macos-latest runner.
    #
    # This is the full suite (Python tests + the Node shim's own tests,
    # typecheck and build) and runs on 3.13 only -- the version
    # pyproject.toml's [project.optional-dependencies].macos-native/build
    # tooling and the packaging workflows (build.yml) target. TST-05
    # (docs/security-remediation-plan.md, phase 2.2) covers the other
    # supported versions (3.11, the `requires-python` floor, and 3.12) via
    # the `test-python-compat` job below with a reduced, Node-free suite --
    # running the Node/shim steps again per Python version would be pure
    # cost with no signal, since the shim is a separate Node runtime not
    # affected by which CPython version the daemon runs under.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache ~/.npm keyed on mcpb/shim/package-lock.json -- without
          # this, `npm ci` below is a fully cold install from the registry
          # on every run (no lockfile changes needed to trigger it).
          cache: npm
          cache-dependency-path: mcpb/shim/package-lock.json

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Install shim dependencies
        run: npm ci
        working-directory: mcpb/shim

      # mcpb/shim/'s own suite (daemon discovery/launch, the stdio<->
      # Streamable HTTP proxy — see docs/https-connector-refactor-plan.md
      # §12, D11) runs against mcpb/shim/src/*.ts directly via tsx. It's the
      # only Node suite left in this repo since P5 retired the bridge.
      - name: Run shim test suite
        run: npm test
        working-directory: mcpb/shim

      - name: Type-check shim
        run: npm run typecheck
        working-directory: mcpb/shim

      # tests/integration/test_shim_mcp_contract.py spawns the real built
      # shim.js against a real /mcp endpoint, so it needs to be built before
      # pytest runs (the test builds it lazily on a cache miss too, but
      # building here keeps that cost out of the timed test step and fails
      # fast on a build error instead of a confusing test skip).
      - name: Build shim
        run: npm run build
        working-directory: mcpb/shim

      # Plain `pytest` already fails the step (non-zero exit) on the first
      # failing test — no extra flags needed to enforce a 100% pass rate.
      # pytest-timeout (configured in pyproject.toml) also fails any test
      # that hangs, so a stuck test can't stall the job indefinitely.
      # --cov-branch (TST-03, docs/security-remediation-plan.md Phase 2.1)
      # catches the class of gap line coverage alone misses -- a branch
      # that's reached but whose other arm never runs. The json/html reports
      # feed the coverage-floor check and the uploaded artifact below; this
      # step itself still only gates on the pass rate, not coverage.
      - name: Run test suite (100% pass rate required)
        run: |
          pytest -v --cov=src/privacyfence --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov

      # Unlike the informational report above, this gates the merge: it
      # fails if overall coverage, or any security-critical module's own
      # coverage, has dropped below its recorded floor. See
      # scripts/check_coverage_floor.py's module docstring for the floors
      # and how to raise one.
      - name: Enforce coverage floor (TST-03 ratchet)
        run: python scripts/check_coverage_floor.py coverage.json

      # Always publish, even on failure above -- a coverage regression is
      # easiest to diagnose with the actual line/branch report in hand
      # rather than re-running locally.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov/
          retention-days: 30

  # TST-05 (docs/security-remediation-plan.md, phase 2.2): prove the
  # package actually works on every Python version pyproject.toml's
  # `requires-python = ">=3.11"` claims to support, not just the 3.13 the
  # `test` job above happens to pin. Deliberately independent of `test`
  # (no `needs:`) so this runs in parallel and a failure here doesn't hide
  # behind/wait on the full job.
  #
  # This is the "reduced core suite" the plan allows for when CI cost
  # matters: the Python test suite only, no Node/npm setup and no shim
  # build. tests/integration/test_shim_mcp_contract.py is explicitly
  # excluded below rather than left to run -- its built_shim_entry fixture
  # would otherwise build the shim from scratch on every matrix leg (GitHub's
  # ubuntu-latest runners ship npm preinstalled, so it wouldn't skip itself
  # the way it does in an environment with no npm at all), which is exactly
  # the redundant Node-toolchain cost this job exists to avoid -- that
  # coverage already comes from the `test` job's 3.13 run.
  test-python-compat:
    name: Test (Python ${{ matrix.python-version }}, core suite)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[test]"

      # Same 100%-pass-rate/pytest-timeout guarantees as the `test` job's
      # run above, minus coverage reporting (that's `test`'s job, and
      # TST-03's coverage ratchet, to own -- duplicating it per Python
      # version here would just be redundant CI time).
      - name: Run test suite (100% pass rate required)
        run: pytest -v --ignore=tests/integration/test_shim_mcp_contract.py
