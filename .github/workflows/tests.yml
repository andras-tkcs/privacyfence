name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  test:
    # Ships on macOS (rumps/PyObjC) and Windows (pystray/pywebview, issue
    # #121) — each platform's tests must run on that same OS, since both
    # the real Unix-... err, real 127.0.0.1-loopback-backed IPC tests (see
    # ipc.py's module docstring) and the native-UI-backed ones (osascript/
    # AppKit on macOS, pywebview/WebView2 on Windows) exercise real OS
    # behavior, not something a single Linux runner could stand in for on
    # either platform's behalf.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # pyproject.toml's dependencies carry sys_platform markers (rumps/
      # pyobjc-* on darwin, pystray/pywebview/Pillow on win32) — this one
      # command installs the right set for whichever OS this leg is on,
      # nothing OS-specific needed here.
      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Install bridge dependencies
        run: npm ci
        working-directory: bridge

      # bridge/'s own suite (IPC framing, error propagation, tool dispatch —
      # see docs/testing-policy.md) runs against bridge/src/*.ts directly via
      # tsx, no build step needed. Node's built-in test runner already fails
      # the step on the first failing test.
      - name: Run bridge test suite
        run: npm test
        working-directory: bridge

      - name: Type-check bridge
        run: npm run typecheck
        working-directory: bridge

      # tests/integration/test_bridge_daemon_contract.py spawns the real
      # built bridge.js against a real IPCServer, so the bridge needs to be
      # built before pytest runs (the test builds it lazily on a cache miss
      # too, but building here keeps that cost out of the timed test step
      # and fails fast on a build error instead of a confusing test skip).
      - name: Build bridge
        run: npm run build
        working-directory: bridge

      # Plain `pytest` already fails the step (non-zero exit) on the first
      # failing test — no extra flags needed to enforce a 100% pass rate.
      # pytest-timeout (configured in pyproject.toml) also fails any test
      # that hangs, so a stuck test can't stall the job indefinitely. The
      # coverage report here is informational only — nothing gates on it.
      # tests/conftest.py's collect_ignore_glob excludes the four
      # AppKit-only test files (test_menu_bar.py/test_approval_window.py/
      # test_dialog_window.py/test_settings_window.py) on this leg, the
      # same way none of Windows's own pystray/pywebview-only test files
      # get excluded on macos-latest — see that conftest's own comment.
      - name: Run test suite (100% pass rate required)
        run: pytest -v --cov=src/privacyfence --cov-report=term-missing
