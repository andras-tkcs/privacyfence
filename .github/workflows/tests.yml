name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  test:
    # P10 (docs/https-connector-refactor-plan.md §12, D6) deleted the last
    # AppKit-tainted code in this repo -- the native menu bar/approval
    # dialogs/settings window -- so nothing here depends on real AppKit/
    # PyObjC behavior any more, and the whole suite is platform-independent.
    # rumps/pyobjc-framework-* aren't installed here or anywhere else --
    # the macos-native extra that used to declare them was removed outright
    # (docs/security-remediation-plan.md Phase 3 PR3.9, ORP-02; the exact
    # package set is preserved in docs/adr/0001-remove-macos-native-extra.md).
    # Runs on ubuntu-latest for the same reason any other
    # platform-independent Python project would: it's the cheaper, faster
    # runner, and there's no longer a platform split to test across two
    # jobs. Building/signing the actual macOS .app/.dmg is still
    # macOS-only, and still covered separately by build.yml on a real
    # macos-latest runner.
    #
    # This is the full suite (Python tests + the Node shim's own tests,
    # typecheck and build) and runs on 3.13 only -- the version
    # pyproject.toml's [project.optional-dependencies].dev/build tooling
    # and the packaging workflows (build.yml) target. TST-05
    # (docs/security-remediation-plan.md, phase 2.2) covers the other
    # supported versions (3.11, the `requires-python` floor, and 3.12) via
    # the `test-python-compat` job below with a reduced, Node-free suite --
    # running the Node/shim steps again per Python version would be pure
    # cost with no signal, since the shim is a separate Node runtime not
    # affected by which CPython version the daemon runs under.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # Cache ~/.npm keyed on mcpb/shim/package-lock.json -- without
          # this, `npm ci` below is a fully cold install from the registry
          # on every run (no lockfile changes needed to trigger it).
          cache: npm
          cache-dependency-path: mcpb/shim/package-lock.json

      - name: Install dependencies
        run: pip install -e ".[test]"

      # tests/integration/test_browser_smoke.py (TST-06, docs/security-
      # remediation-plan.md Phase 2 item 2.5) drives this Chromium build
      # directly via the `playwright` package installed above --
      # `--with-deps` also installs the OS-level shared libraries the
      # ubuntu-latest runner image doesn't ship by default. Chromium only:
      # this suite never touches Firefox/WebKit, so there's nothing to gain
      # from downloading either.
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install shim dependencies
        run: npm ci
        working-directory: mcpb/shim

      # mcpb/shim/'s own suite (daemon discovery/launch, the stdio<->
      # Streamable HTTP proxy — see docs/https-connector-refactor-plan.md
      # §12, D11) runs against mcpb/shim/src/*.ts directly via tsx. It's the
      # only Node suite left in this repo since P5 retired the bridge.
      - name: Run shim test suite
        run: npm test
        working-directory: mcpb/shim

      - name: Type-check shim
        run: npm run typecheck
        working-directory: mcpb/shim

      # tests/integration/test_shim_mcp_contract.py spawns the real built
      # shim.js against a real /mcp endpoint, so it needs to be built before
      # pytest runs (the test builds it lazily on a cache miss too, but
      # building here keeps that cost out of the timed test step and fails
      # fast on a build error instead of a confusing test skip).
      - name: Build shim
        run: npm run build
        working-directory: mcpb/shim

      # Plain `pytest` already fails the step (non-zero exit) on the first
      # failing test — no extra flags needed to enforce a 100% pass rate.
      # pytest-timeout (configured in pyproject.toml) also fails any test
      # that hangs, so a stuck test can't stall the job indefinitely.
      # --cov-branch (TST-03, docs/security-remediation-plan.md Phase 2.1)
      # catches the class of gap line coverage alone misses -- a branch
      # that's reached but whose other arm never runs. The json/html reports
      # feed the coverage-floor check and the uploaded artifact below; this
      # step itself still only gates on the pass rate, not coverage.
      - name: Run test suite (100% pass rate required)
        run: |
          pytest -v --cov=src/privacyfence --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov

      # Unlike the informational report above, this gates the merge: it
      # fails if overall coverage, or any security-critical module's own
      # coverage, has dropped below its recorded floor. See
      # scripts/check_coverage_floor.py's module docstring for the floors
      # and how to raise one.
      - name: Enforce coverage floor (TST-03 ratchet)
        run: python scripts/check_coverage_floor.py coverage.json

      # Always publish, even on failure above -- a coverage regression is
      # easiest to diagnose with the actual line/branch report in hand
      # rather than re-running locally.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov/
          retention-days: 30

      # tests/integration/test_browser_smoke.py's own _capture_failure_
      # artifacts fixture (docs/automated-test-strategy-plan.md Phase 4 item
      # 4.5) writes a screenshot/DOM/console/daemon-log bundle per failing
      # test under test-results/browser-smoke/, but only ever locally to the
      # runner's own disk -- upload it so a CI failure in that suite is
      # diagnosable from the Actions run itself, not just the traceback.
      # `failure()`, not `always()`: a passing (or never-reached) run leaves
      # the directory empty or missing, and if-no-files-found: ignore keeps
      # that the common, unremarkable case rather than a warning on every
      # green run.
      - name: Upload browser-smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure-artifacts
          path: test-results/browser-smoke/
          if-no-files-found: ignore
          retention-days: 30

  # TST-05 (docs/security-remediation-plan.md, phase 2.2): prove the
  # package actually works on every Python version pyproject.toml's
  # `requires-python = ">=3.11"` claims to support, not just the 3.13 the
  # `test` job above happens to pin. Deliberately independent of `test`
  # (no `needs:`) so this runs in parallel and a failure here doesn't hide
  # behind/wait on the full job.
  #
  # This is the "reduced core suite" the plan allows for when CI cost
  # matters: the Python test suite only, no Node/npm setup and no shim
  # build. tests/integration/test_shim_mcp_contract.py is explicitly
  # excluded below rather than left to run -- its built_shim_entry fixture
  # would otherwise build the shim from scratch on every matrix leg (GitHub's
  # ubuntu-latest runners ship npm preinstalled, so it wouldn't skip itself
  # the way it does in an environment with no npm at all), which is exactly
  # the redundant Node-toolchain cost this job exists to avoid -- that
  # coverage already comes from the `test` job's 3.13 run.
  test-python-compat:
    name: Test (Python ${{ matrix.python-version }}, core suite)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[test]"

      # Same 100%-pass-rate/pytest-timeout guarantees as the `test` job's
      # run above, minus coverage reporting (that's `test`'s job, and
      # TST-03's coverage ratchet, to own -- duplicating it per Python
      # version here would just be redundant CI time).
      - name: Run test suite (100% pass rate required)
        run: pytest -v --ignore=tests/integration/test_shim_mcp_contract.py

  # docs/windows-support-plan.md Phase 6.2 (B5 in docs/windows-linux-
  # support-plan.md): a real-Windows confirmation that nothing path-
  # separator- or Path-handling-related breaks that the `test` job above
  # (already proven platform-independent on a second POSIX platform via
  # Linux CI) can't catch. Originally gated to workflow_dispatch only, with
  # Phase 6.2's own text leaving "keep it permanent" vs. "rely on build.yml's
  # release-time Windows job alone" as a decision for once it had actually
  # been run for real. docs/automated-test-strategy-plan.md Phase 2.1 makes
  # that call: promoted to a permanent per-PR leg (renamed test-windows ->
  # platform-windows to match) now that it's proven green.
  #
  # Deliberately still the full core suite, not narrowed to Phase 2.3's
  # targeted tests/platform/ subset -- Phase 2.4 considered narrowing and
  # decided against it: this job's own first real run found four genuine
  # cross-platform bugs (docs/windows-support-plan.md Phase 6.3) in ordinary
  # modules with no platform marker (settings_controller.py, drive.py, a
  # shim-contract test, an audit-log test), none of which lived in
  # tests/platform/'s own subject matter -- a subset chosen ahead of time
  # would have missed them. See automated-test-strategy-plan.md Phase 2's
  # status note for the full reasoning.
  platform-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[test]"

      # Core Python suite only -- no Node/shim steps here, same "reduced
      # suite" reasoning test-python-compat gives, since this job exists to
      # catch Windows-specific breakage in the Python core, not to
      # re-prove the (already cross-platform, Node-runtime) shim.
      - name: Run test suite (100% pass rate required)
        run: pytest -v --cov=src/privacyfence --cov-report=term-missing

  # docs/automated-test-strategy-plan.md Phase 2.2: the macOS leg of the
  # same "does the runtime work on every desktop OS" question 2.1's
  # platform-windows job already answers for Windows -- runs the identical
  # core suite (same reasoning: catch macOS-specific breakage in the Python
  # core, not re-prove the Node-runtime shim, which build.yml's real DMG
  # build already exercises on macos-latest separately). Deliberately not
  # scoped to `scripts/build_dmg.sh`/signing/notarization -- that stays
  # build.yml's job, tag-triggered only; this job runs from source, on
  # every PR, the same way platform-windows does. Same Phase 2.4 decision as
  # platform-windows above: full core suite, not narrowed to tests/platform/.
  platform-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[test]"

      # Core Python suite only -- same reduced-suite reasoning as
      # platform-windows above.
      - name: Run test suite (100% pass rate required)
        run: pytest -v --cov=src/privacyfence --cov-report=term-missing

  # docs/automated-test-strategy-plan.md Phase 8 item 2 (TST-16, docs/
  # security-remediation-plan.md Phase 3 item 3.11): tests/integration/
  # test_org_ubuntu_release_smoke.py gates its whole module behind
  # PRIVACYFENCE_RUN_RELEASE_SMOKE_TESTS -- unset everywhere else in this
  # file, so the `test` job's own full-suite run above always skips it
  # instantly. Before Phase 8, the only thing that ever set that variable
  # was build.yml's tag-triggered build-deb job -- the same dispatch/tag-
  # only gap platform-windows had before Phase 2.1 promoted it. Promoted
  # here the same way, as its own permanent per-PR leg: the module's own
  # "Why a --target install, not the .deb" section is what keeps this
  # cheap enough to run on every PR (a `pip install --target` of this
  # package, seconds, not build.yml's real PyInstaller/.deb pipeline,
  # minutes) without waiting for a release tag to find out org mode broke.
  org-mode-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run org-mode release-workflow smoke test
        env:
          PRIVACYFENCE_RUN_RELEASE_SMOKE_TESTS: "1"
        run: pytest -v tests/integration/test_org_ubuntu_release_smoke.py

  # docs/security-remediation-plan.md, Phase 2 item 2.3 (TST-07). Separate
  # job (not a step tacked onto `test` above) so a lint failure is reported
  # on its own line in the checks list, and so it doesn't need the Node/npm
  # setup or shim build the `test` job carries for pytest's sake.
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[test,lint]"

      # Blocking: see [tool.ruff]/[tool.ruff.lint] in pyproject.toml for
      # exactly which rules this enforces and why.
      - name: Lint (ruff)
        run: ruff check .

      # Non-blocking for now (see [tool.mypy] in pyproject.toml) --
      # `continue-on-error` keeps the finding visible as a failed step in
      # the Actions UI without failing the job, so it can be tightened to
      # blocking per-module without a workflow change once modules are
      # clean.
      - name: Type-check (mypy, informational)
        continue-on-error: true
        run: mypy src/privacyfence

      # Non-blocking for now (see [tool.bandit] in pyproject.toml) -- same
      # reasoning as mypy above.
      - name: Security lint (bandit, informational)
        continue-on-error: true
        run: bandit -c pyproject.toml -r src
