name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/images/**"
      - "src/privacyfence/resources/icon_512.png"
      - ".github/workflows/pages.yml"
  release:
    types: [published, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp website/index.html website/styles.css website/stats.js _site/
          cp src/privacyfence/resources/icon_512.png _site/assets/icon.png
          cp docs/images/screenshots/gmail-read-thread.png _site/assets/
          cp docs/images/screenshots/sheets-write.png _site/assets/
          touch _site/.nojekyll

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "privacyfence-pages-workflow",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          repository = get(f"https://api.github.com/repos/{repo}")
          releases = get(f"https://api.github.com/repos/{repo}/releases?per_page=100")
          downloads = sum(
              int(asset.get("download_count", 0))
              for release in releases
              if not release.get("draft")
              for asset in release.get("assets", [])
          )
          published = [r for r in releases if not r.get("draft") and not r.get("prerelease")]
          latest = published[0].get("tag_name") if published else None

          data = {
              "downloads": downloads,
              "stars": int(repository.get("stargazers_count", 0)),
              "latest_release": latest,
          }
          with open("_site/release-stats.json", "w", encoding="utf-8") as f:
              json.dump(data, f, separators=(",", ":"))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
