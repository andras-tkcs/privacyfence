name: Deploy download Worker

# docs/release-publishing-kpi-plan.md Phase 1. Deploys cloudflare/downloads/ -- the Worker
# backing https://downloads.privacyfence.eu -- whenever it changes on `main`. Deliberately
# separate from build.yml/publish-pypi.yml: this Worker ships on every merge to `main`, not on a
# release tag, and has nothing to do with the daemon's own version/release mechanics.
#
# `verify` also runs on `pull_request` (same path filter as `push`) so a PR that breaks the
# Worker fails its own checks instead of merging green and only surfacing the break on `main`
# afterwards -- the same gap `platform-windows` and `org-mode-smoke` were promoted from
# dispatch-only to per-PR to close (see scripts/update_branch_protection.py). `deploy` still only
# runs on a push to `main` (or a manual dispatch): it needs `verify` to pass first and needs
# Cloudflare credentials a fork PR's `pull_request` run must never receive. `verify`'s job name is
# deliberately not `test` -- that name is already tests.yml's per-PR job, and reusing it here
# would put two differently-scoped checks under one ambiguous name in the PR checks list.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/downloads/**"
      - ".github/workflows/deploy-download-worker.yml"
  pull_request:
    paths:
      - "cloudflare/downloads/**"
      - ".github/workflows/deploy-download-worker.yml"
  workflow_dispatch:   # allow manual redeploys from the Actions tab

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/downloads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/downloads/package-lock.json

      # `npm install`'s own dependency resolution hits a known npm/arborist bug on this
      # dependency set (a circular optional-peer chain through @cloudflare/vitest-pool-workers ->
      # miniflare -> vitest); package.json's `overrides.vitest` pin works around it, which is why
      # this is a plain `npm ci` (respects the already-resolved package-lock.json) rather than
      # anything needing `--legacy-peer-deps` here.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs entirely against local Miniflare/workerd -- no Cloudflare credentials involved, and
      # nothing here touches the real R2 bucket or D1 database.
      - name: Run unit/integration tests
        run: npm test

      # Validates the Worker actually bundles (catches anything `tsc --noEmit` can't, like
      # bundler-incompatible syntax or a binding wrangler.toml doesn't actually resolve) without
      # deploying or needing credentials.
      - name: Dry-run bundle
        run: npm run dry-run

  deploy:
    needs: verify
    # Never on a `pull_request` run: deploying (and the Cloudflare credentials that requires)
    # must not happen for an unmerged change, fork-authored or not -- only a push to `main` (via
    # the trigger's own `branches: [main]` filter) or a manual dispatch reach this job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/downloads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/downloads/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Idempotent: a rerun against migrations already applied is a no-op (see wrangler's own
      # d1 migrations apply docs). `--remote` targets the real, already-provisioned
      # `privacyfence-downloads` D1 database (docs/release-publishing-kpi-plan.md's
      # Prerequisites section) -- never `--local`, which would apply to an ephemeral runner-only
      # database instead. Non-interactive in CI, per wrangler's own CI/CD detection --
      # confirmation is skipped automatically, a backup is still captured.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # HEAD, never GET -- a release-CI smoke check must never itself inflate the download KPI
      # (docs/release-publishing-kpi-plan.md's cross-cutting notes), though /health touches
      # neither R2 nor D1 either way.
      - name: Smoke-test /health
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' --head https://downloads.privacyfence.eu/health)"
          if [ "$status" != "200" ]; then
            echo "::error::GET /health returned $status, expected 200"
            exit 1
          fi
