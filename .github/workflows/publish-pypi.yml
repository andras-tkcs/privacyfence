name: Publish to PyPI

# Same trigger as build.yml (see CLAUDE.md's "Releasing" section) -- one tag
# push does everything: builds and signs the DMG (build.yml) *and* builds
# and publishes the sdist/wheel (this workflow), with no separate step.
# Independently triggered, but no longer independently *gated*: the
# `wait_for_build` job below (docs/automated-test-strategy-plan.md Phase 6.4)
# blocks every publish step here on build.yml's own run for this exact commit
# actually succeeding -- packaged-artifact test failures (macOS/Windows/Linux)
# block PyPI/TestPyPI/R2 publication too, not just their own platform's DMG/
# installer/.deb.
#
# Publishing itself uses PyPI's OIDC "Trusted Publisher" flow
# (pypa/gh-action-pypi-publish), not a stored API token: GitHub mints a
# short-lived OIDC token for the job (permissions: id-token: write below),
# and PyPI/TestPyPI trade it for a one-shot upload credential themselves.
# There is no long-lived secret anywhere for this workflow to leak. Before
# this workflow can publish for the first time, a maintainer has to
# register it as a Trusted Publisher on both test.pypi.org and pypi.org --
# see CLAUDE.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # rerun by hand, e.g. after a failed publish -- point it
                        # at a tagged commit, or the build carries a local
                        # version segment (+g<sha>) that both indexes reject

# Restrictive default for GITHUB_TOKEN, per CodeQL's actions/missing-workflow-
# permissions check -- only `build` actually inherits this (it checks out the
# repo); the two publish jobs below declare their own narrower job-level
# `permissions:` (id-token: write only, no contents access at all), which
# replaces this default for them rather than adding to it.
permissions:
  contents: read

jobs:
  # Phase 6.4 (docs/automated-test-strategy-plan.md): "Wire all three [macOS/Windows/Linux
  # packaged-artifact tests] into the release build workflows (build.yml, publish-pypi.yml) ahead
  # of the publish step... A failed packaged-artifact test blocks publication."
  #
  # GitHub Actions has no native `needs:` across separate workflow files -- build.yml and this
  # workflow are two independent listeners on the same `push: tags: ['v*']` event, so there's no
  # job graph connecting them the way `needs:` connects jobs within one file. This job is the
  # closest equivalent: it polls the REST API for build.yml's *own* run against this exact commit
  # (not "the latest run of build.yml," which could be a different tag or a stray
  # workflow_dispatch) and blocks every job below on that run actually succeeding, via an ordinary
  # `needs:` edge inside this workflow. `build` (the sdist/wheel) still runs immediately in
  # parallel -- it's cheap, side-effect-free, and needed either way -- only the three `publish-*`
  # jobs actually wait on this one.
  #
  # A `workflow_dispatch` rerun (e.g. after a transient publish failure) is gated the same way: if
  # build.yml's original run for that tag's commit already succeeded, this job finds that same
  # result immediately (the API query is keyed on commit SHA, not run recency) and the rerun
  # proceeds; if build.yml never succeeded for that commit, the rerun blocks here until someone
  # fixes and reruns "Build & Release" for that tag.
  wait_for_build:
    runs-on: ubuntu-latest
    permissions:
      actions: read   # only permission this job needs -- it never checks out the repo
    steps:
      - name: Wait for build.yml's run on this commit to succeed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowId = "build.yml";
            const pollIntervalMs = 30_000;
            // build.yml's `build` job alone (DMG + notarization + TST-15) has run well past ten
            // minutes before; leave real headroom rather than risk a flaky timeout on release day.
            const maxWaitMs = 60 * 60_000;
            const start = Date.now();
            const { owner, repo } = context.repo;
            const sha = context.sha;

            core.info(`Waiting for ${workflowId}'s own run against commit ${sha}...`);

            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflowId, head_sha: sha, per_page: 10,
              });
              if (data.workflow_runs.length > 0) {
                // Most recent attempt for this exact commit, in case of a manual re-run.
                const run = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
                core.info(`Found ${run.html_url} (status=${run.status}, conclusion=${run.conclusion})`);
                if (run.status === "completed") {
                  if (run.conclusion === "success") {
                    core.info("build.yml succeeded for this commit -- proceeding to publish.");
                    return;
                  }
                  core.setFailed(
                    `build.yml's own run for this commit did not succeed ` +
                    `(conclusion=${run.conclusion}): ${run.html_url}. Fix and re-run ` +
                    `"Build & Release" for this tag, then re-run "Publish to PyPI".`,
                  );
                  return;
                }
              }
              if (Date.now() - start > maxWaitMs) {
                core.setFailed(
                  `Timed out after ${Math.round(maxWaitMs / 60_000)} minutes waiting for ` +
                  `${workflowId}'s run against ${sha} to complete.`,
                );
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
            }

  build:
    runs-on: ubuntu-latest   # pure Python sdist/wheel -- no macOS-only step needed
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: dist/

      # Drives both the public-index gating below (see CLAUDE.md's "Releasing" section and
      # scripts/r2_release.py's module docstring: only a "stable" tag reaches PyPI/TestPyPI --
      # alpha/beta/rc stop at the private R2 mirror published by the publish-r2 job) and that
      # job's R2 key prefix (releases/<channel>/<version>/...). Same "skip off a tag" tolerance as
      # build.yml's identically-named step, for this workflow's own workflow_dispatch reruns.
      - name: Determine version and release channel
        id: release
        run: |
          VERSION="$(python3 -m setuptools_scm)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

  # Always published first -- rehearses the real upload (same files, same
  # metadata) against TestPyPI before anything reaches the real index.
  #
  # Stable only -- alpha/beta/rc sdists/wheels never reach a public index at all (unlike the DMG/
  # SBOMs in build.yml, which still get a public, asset-less GitHub Release entry for every
  # channel); the publish-r2 job below is where every channel's sdist/wheel actually lands.
  publish-testpypi:
    needs: [build, wait_for_build]
    if: needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: testpypi   # must match the Environment name on TestPyPI's
                             # Trusted Publisher entry, if one was set there
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to TestPyPI
        # Pinned to the tip of upstream's own `release/v1` tracking branch
        # rather than a one-off tag -- that's the branch pypa itself
        # recommends following for v1.x, and Dependabot bumps this SHA the
        # same way it bumps any other action pin (see .github/dependabot.yml).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # lets a rerun after a partial failure succeed
                                 # without erroring on files TestPyPI already has

  # Gated behind the TestPyPI job above, and behind the "pypi" GitHub
  # Environment's own protection rules if any are configured (e.g. a
  # required reviewer) -- see CLAUDE.md for setting that up.
  # No explicit channel gate needed here: `needs: publish-testpypi` already means this job is
  # skipped automatically whenever that job is (GitHub Actions skips a dependent job when its
  # `needs` job was itself skipped, not just when it failed) -- and publish-testpypi is the one
  # gated on `channel == 'stable'` above.
  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi   # must match the Environment name on PyPI's own
                         # Trusted Publisher entry, if one was set there
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        # See the TestPyPI job's "Publish to TestPyPI" step above for why
        # this is pinned to release/v1's tip rather than a one-off tag.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          skip-existing: true

  # Independent of the two PyPI jobs above (doesn't `needs:` either one, and isn't gated on
  # channel) -- this is where *every* channel's sdist/wheel actually lands, stable included: R2 is
  # the one archive that has everything, same as build.yml's DMG/SBOM uploads. It only needs the
  # `build` job's artifact and version/channel output, not a successful PyPI publish. It does,
  # like the two PyPI jobs, still wait on `wait_for_build` (Phase 6.4): R2 is meant to be a
  # complete record of what a tag actually shipped, not a place a broken build's bits land anyway
  # just because nothing public depends on them.
  publish-r2:
    needs: [build, wait_for_build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      # Requires these GitHub secrets/vars (Settings → Secrets and variables → Actions), same
      # names r2-smoke-test.yml used before it was deleted -- see scripts/r2_release.py's module
      # docstring for the bucket layout and why alpha/beta/rc stop here rather than reaching PyPI.
      - name: Publish sdist and wheel to Cloudflare R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/r2_release.py upload --version "${{ needs.build.outputs.version }}" dist/*
