name: R2 smoke test

on:
  workflow_dispatch:

jobs:
  test-r2:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install R2 client
        run: python -m pip install boto3

      - name: Test R2 upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
          RUN_ID: ${{ github.run_id }}
        run: |
          python <<'PY'
          import os
          import boto3

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              region_name="auto",
          )

          bucket = os.environ["R2_BUCKET"]
          key = f"_smoke/github-actions-{os.environ['RUN_ID']}.txt"

          s3.put_object(
              Bucket=bucket,
              Key=key,
              Body=b"PrivacyFence GitHub Actions -> Cloudflare R2 OK\n",
              ContentType="text/plain",
          )

          result = s3.head_object(Bucket=bucket, Key=key)

          print(f"SUCCESS: uploaded s3://{bucket}/{key}")
          print(f"Size: {result['ContentLength']} bytes")
          PY
