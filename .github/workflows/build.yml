name: Build & Release DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  build:
    runs-on: macos-latest   # arm64 Apple Silicon runner
    permissions:
      contents: write
    env:
      # Name of the notarytool keychain profile created fresh on each runner
      # by the "Import notarization credentials" step below — not a secret,
      # just needs to match between that step and the build step.
      NOTARIZE_PROFILE: privacyfence-ci-notary

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: brew install create-dmg

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      # Drives both the release-channel gating below (only a "stable" tag gets a public GitHub
      # Release asset -- see CLAUDE.md's "Releasing" section and scripts/r2_release.py's module
      # docstring for why alpha/beta/rc stop at the private R2 archive) and the R2 upload's key
      # prefix (releases/<channel>/<version>/...).
      # A workflow_dispatch run off an untagged commit never reaches any of the tag-gated steps
      # below, so the version/channel lookup is skipped for those runs rather than failing them --
      # r2_release.py's channel command deliberately rejects a between-tags dev version (see its
      # own docstring), which every untagged commit's __version__ is.
      - name: Determine version and release channel
        id: release
        run: |
          VERSION="$(python -c 'from privacyfence import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

      # ── Import Developer ID certificate for signing ────────────────────────
      # Requires these GitHub secrets (Settings → Secrets and variables →
      # Actions):
      #   MACOS_CERTIFICATE      — base64-encoded "Developer ID Application"
      #                            .p12 (cert + private key)  (base64 -i cert.p12 | pbcopy)
      #   MACOS_CERTIFICATE_PWD  — the .p12 export password
      #   SIGN_IDENTITY          — e.g. "Developer ID Application: Your Name (TEAMID)"
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # Disable the keychain's idle-lock timeout (default 5 minutes).
          # Without this, the keychain locks itself partway through the
          # PyInstaller + mcpb build (which takes well over 5 minutes),
          # and the later `xcrun notarytool submit` step -- which reads the
          # stored notarization credentials from this keychain -- fails
          # with "keychainLocked". `set-keychain-settings` with no -t/-l
          # flags means "no timeout, don't lock on sleep".
          security set-keychain-settings build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "" build.keychain
          rm certificate.p12

      # ── Import notarization credentials ─────────────────────────────────────
      # Runners are ephemeral, so the notarytool profile is (re-)registered
      # fresh every run rather than assumed to already exist. Requires an
      # App Store Connect API key with the "Developer" role (Users and Access
      # → Integrations → App Store Connect API) and these GitHub secrets:
      #   APPLE_API_KEY_P8      — base64-encoded AuthKey_<KEYID>.p8  (base64 -i AuthKey_*.p8 | pbcopy)
      #   APPLE_API_KEY_ID      — the Key ID shown next to the key
      #   APPLE_API_ISSUER_ID   — the Issuer ID (same for all keys on the team)
      - name: Import notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > apple_api_key.p8
          xcrun notarytool store-credentials "$NOTARIZE_PROFILE" \
            --key apple_api_key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          rm apple_api_key.p8

      # Defensive re-unlock immediately before the long build step (PyInstaller
      # + mcpb, ~10 minutes) that ends with `xcrun notarytool submit` reading
      # credentials from this keychain. `set-keychain-settings` above should
      # already prevent an idle-timeout lock, but re-unlocking here is cheap
      # insurance against other lock triggers (e.g. a runner sleep/wake event).
      - name: Unlock keychain before build
        run: security unlock-keychain -p "" build.keychain

      - name: Build .app and DMG
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: bash scripts/build_dmg.sh

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PrivacyFence-dmg
          path: dist/PrivacyFence-*.dmg
          retention-days: 30

      # Every channel's DMG + the two org config build scripts land in the private R2 release
      # archive (releases/<channel>/<version>/...) -- see scripts/r2_release.py's module
      # docstring. This runs for stable *and* pre-release tags alike: R2 is the one archive that
      # has everything, regardless of what's also public elsewhere.
      #
      # Alongside the DMG, also upload the two org config build scripts (scripts/
      # build_org_bundle.py and scripts/sync_room_directory.py). They're stdlib-only / a checked-
      # out copy is not what IT admins are expected to go find -- unlike the rest of scripts/,
      # these two are themselves a release output, run by org admins (not contributors) to
      # produce/update the org_config.json bundle distributed to end users -- see their own
      # docstrings and docs/google-cloud-setup.md, docs/slack-setup.md, docs/salesforce-setup.md,
      # docs/atlassian-setup.md.
      #
      # Requires these GitHub secrets/vars (Settings → Secrets and variables → Actions), same
      # names r2-smoke-test.yml used before it was deleted:
      #   CF_R2_ACCESS_KEY_ID / CF_R2_SECRET_ACCESS_KEY  — R2 API token (secrets)
      #   CF_R2_ENDPOINT                                 — R2 S3-compatible endpoint URL (var)
      - name: Publish release artifacts to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
        run: |
          python3 -m pip install --quiet --user boto3
          python3 scripts/r2_release.py upload --version "${{ steps.release.outputs.version }}" \
            dist/PrivacyFence-*.dmg \
            scripts/build_org_bundle.py \
            scripts/sync_room_directory.py

      # Only a stable tag also gets a public GitHub Release with attached binaries -- alpha/beta/rc
      # stop at the private R2 upload above (see scripts/r2_release.py's module docstring for why).
      # The release entry itself (tag + notes, no files) still gets created for every channel,
      # marked prerelease, so update_checker.py's beta update channel -- which reads exactly that
      # flag off the releases list -- keeps working without the underlying DMG being public.
      - name: Attach release assets (stable only)
        if: startsWith(github.ref, 'refs/tags/') && steps.release.outputs.channel == 'stable'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/PrivacyFence-*.dmg
            scripts/build_org_bundle.py
            scripts/sync_room_directory.py
          prerelease: false

      - name: Create GitHub Release notes (pre-release, no public assets)
        if: startsWith(github.ref, 'refs/tags/') && steps.release.outputs.channel != 'stable'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true

  # docs/windows-support-plan.md Phase 6 (B5 in docs/windows-linux-support-
  # plan.md): the Windows analogue of the `build` job above. Runs in
  # parallel with it (and with `sbom`) rather than depending on it -- same
  # "independent, tagged-source-tree-only" reasoning the `sbom` job's own
  # comment gives, and the same already-established pattern of multiple
  # jobs each attaching their own files to the one GitHub Release for this
  # tag (this job's own release steps below, `build`'s, and `sbom`'s).
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcpb/shim/package-lock.json

      # Provides iscc.exe (installer/privacyfence.iss, run by
      # scripts/build_installer.ps1) -- not preinstalled on windows-latest.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      # Same version/channel resolution as the `build` job's identically-
      # named step -- see its comments for why the channel lookup is
      # skipped (rather than failing the run) off a tag, and why a
      # workflow_dispatch run off an untagged commit only skips the
      # tag-gated steps below rather than failing outright.
      - name: Determine version and release channel
        id: release
        shell: bash
        run: |
          VERSION="$(python -c 'from privacyfence import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

      # ── Import Authenticode certificate for signing ──────────────────────
      # Requires these GitHub secrets (Settings → Secrets and variables →
      # Actions) -- unset entirely (e.g. on a fork's workflow_dispatch run)
      # means build_installer.ps1 just produces an unsigned build (see its
      # own Invoke-Signing helper):
      #   WINDOWS_CERTIFICATE      — base64-encoded Authenticode .pfx
      #                              (cert + private key)
      #                              (base64 -w0 cert.pfx | Set-Clipboard, or
      #                              on Windows: certutil -encode)
      #   WINDOWS_CERTIFICATE_PWD  — the .pfx export password
      # docs/windows-support-plan.md Phase 5.1's default decision: start with
      # an OV cert via a portable .pfx (this step), revisit an EV/HSM-backed
      # signing service later only if SmartScreen friction on first run
      # turns out to matter for real users.
      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", $bytes)
          echo "SIGN_CERT_PATH=$env:RUNNER_TEMP\certificate.pfx" >> $env:GITHUB_ENV

      - name: Build installer
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\certificate.pfx"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PrivacyFence-windows-installer
          path: dist/PrivacyFence-*-setup.exe
          retention-days: 30

      # Same private-by-default R2 archive as the `build` job's DMG upload --
      # every channel's installer lands in releases/<channel>/<version>/,
      # alongside whatever else that release shipped. See scripts/
      # r2_release.py's module docstring and this repo's CLAUDE.md
      # "Cloudflare R2 release archive" section.
      - name: Publish release artifacts to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
        shell: bash
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/r2_release.py upload --version "${{ steps.release.outputs.version }}" \
            dist/PrivacyFence-*-setup.exe

      # Stable only, same gating as the `build` job's DMG attachment --
      # alpha/beta/rc installers stop at the private R2 upload above.
      - name: Attach release assets (stable only)
        if: startsWith(github.ref, 'refs/tags/') && steps.release.outputs.channel == 'stable'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/PrivacyFence-*-setup.exe
          prerelease: false

      - name: Create GitHub Release notes (pre-release, no public assets)
        if: startsWith(github.ref, 'refs/tags/') && steps.release.outputs.channel != 'stable'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true

  # SEC-19 (docs/security-remediation-plan.md, Phase 2.4): one CycloneDX SBOM
  # per ecosystem this repo ships code from. Independent of the `build` job
  # above -- doesn't need the macOS runner, code signing, or notarization,
  # just the same tagged source tree -- so it runs in parallel rather than
  # gating on (or blocking) the DMG build.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see CLAUDE.md)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcpb/shim/package-lock.json

      # Same version/channel resolution as the `build` job above, independently -- this job
      # doesn't `pip install -e .` the package itself (see the "Generate Python SBOM" step's own
      # comment for why it deliberately doesn't), so it reads the tag-derived version straight
      # from setuptools_scm instead of from an installed __version__.
      # See the `build` job's identically-named step for why the channel lookup is skipped
      # (rather than failing the run) off a tag.
      - name: Determine version and release channel
        id: release
        run: |
          pip install --quiet setuptools_scm
          VERSION="$(python3 -m setuptools_scm)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

      # From requirements/runtime.lock.txt, not a fresh resolve -- the SBOM
      # should describe exactly what a `pip install privacyfence` gets
      # (and what pip-audit's blocking job in dependency-audit.yml already
      # vetted), not whatever the resolver would pick today.
      - name: Generate Python SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements/runtime.lock.txt \
            --pyproject pyproject.toml \
            --of JSON -o sbom-python.cdx.json

      # --omit dev: the shim's devDependencies (esbuild, tsx, typescript,
      # @types/node) never ship inside the built .mcpb -- see
      # mcpb/shim/build.mjs -- so they don't belong in an SBOM describing
      # what's actually distributed, same reasoning as
      # dependency-audit.yml's `npm audit --omit=dev`.
      - name: Generate Node shim SBOM
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev \
            --output-file ../../sbom-shim-npm.cdx.json
        working-directory: mcpb/shim

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PrivacyFence-sbom
          path: |
            sbom-python.cdx.json
            sbom-shim-npm.cdx.json
          retention-days: 30

      # Same private-by-default R2 archive as the DMG (see the `build` job's "Publish release
      # artifacts to Cloudflare R2" step) -- every channel's SBOMs land in
      # releases/<channel>/<version>/, alongside whatever else that release shipped.
      - name: Publish SBOMs to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/r2_release.py upload --version "${{ steps.release.outputs.version }}" \
            sbom-python.cdx.json \
            sbom-shim-npm.cdx.json

      # Stable only, same as the `build` job's DMG attachment -- alpha/beta/rc SBOMs stop at the
      # R2 upload above, no public GitHub Release asset.
      - name: Attach SBOMs to release (stable only)
        if: startsWith(github.ref, 'refs/tags/') && steps.release.outputs.channel == 'stable'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            sbom-python.cdx.json
            sbom-shim-npm.cdx.json
          prerelease: false
