name: Connector live check

# Runs only on a schedule or by explicit maintainer trigger -- never on
# pull_request, never on push from a branch a non-maintainer controls.
# Targets the self-hosted runner provisioned in docs/connector-ci-integration-plan.md
# Phase B (label `privacyfence-test`), which is the only place these
# connectors' live OAuth credentials ever exist. See docs/testing-policy.md's
# "Runner-local live tier" section.
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC -- matched to how often
                           # a provider API actually changes shape, not to
                           # PR cadence; see the plan's rationale
  workflow_dispatch:

permissions:
  contents: write        # needed to push the drift branch
  pull-requests: write   # needed for create-pull-request to open the PR itself

concurrency:
  group: connector-live-check
  cancel-in-progress: false   # never cancel a run mid-way through a live
                               # provider call sequence

env:
  # The one persistent, hand-provisioned working copy on this runner --
  # NOT the ephemeral actions/checkout workspace Actions would otherwise
  # give this job. org_config.json, credentials/, tests/fixtures/
  # qa_environment.yaml and the runner-local .venv all live here (Phase
  # B.3) because paths.py's data_dir() resolves org/credential storage
  # relative to wherever this package's own source files physically sit
  # on disk, for a non-installed source checkout -- so the script has to
  # actually run from this exact directory to see any of them. A fresh
  # actions/checkout workspace is a different directory and would never
  # see this runner's credentials no matter how it's configured.
  PF_CHECKOUT: /home/pf-runner/privacyfence

jobs:
  live-check:
    runs-on: [self-hosted, privacyfence-test]
    timeout-minutes: 20   # generous but bounded -- this should be a few
                           # minutes of read calls, not an open-ended job

    steps:
      # No actions/checkout here -- see the PF_CHECKOUT comment above.
      # Instead, fast-forward the runner's own persistent clone to this
      # workflow's commit in place. This only ever touches tracked files
      # (a plain `git checkout --force`, no `clean`/`git clean` step), so
      # credentials/, org/, .venv/ and tests/fixtures/qa_environment.yaml
      # -- all gitignored -- are left exactly as this runner has them.
      - name: Update the persistent checkout to this commit
        working-directory: ${{ env.PF_CHECKOUT }}
        run: |
          git fetch origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      # No setup-python/setup-node steps here -- the self-hosted runner
      # keeps its own persistent venv (Phase B), rebuilt manually when
      # dependencies change, rather than a fresh install every run. A
      # GitHub-hosted job would need setup-python; this one deliberately
      # doesn't, since the point is minimal, auditable actions on a
      # credential-holding machine.
      - name: Verify the runner-local venv exists
        working-directory: ${{ env.PF_CHECKOUT }}
        run: |
          if [ ! -x .venv/bin/python ]; then
            echo "##[error] .venv/bin/python not found in $(pwd)." \
                 "Create the persistent venv once on this runner:" \
                 "python3.13 -m venv .venv && .venv/bin/pip install -e '.[test]'" \
                 "-- see docs/connector-ci-integration-plan.md Phase B.3."
            exit 1
          fi

      - name: Run qa_fixture_recorder.py --check
        id: check
        working-directory: ${{ env.PF_CHECKOUT }}
        run: |
          .venv/bin/python scripts/qa_fixture_recorder.py --check \
            --report-file /tmp/qa-check-report.md
        continue-on-error: true   # a drift finding is data, not a crash --
                                   # handled by the next step, not by failing
                                   # the job outright

      - name: Re-record on drift
        if: steps.check.outcome == 'failure'
        working-directory: ${{ env.PF_CHECKOUT }}
        run: |
          .venv/bin/python scripts/qa_fixture_recorder.py --record \
            --report-file /tmp/qa-record-report.md

      # Opens a PR only when --record actually changed a fixture file --
      # a maintainer reviews the redacted diff exactly as the manual
      # process in testing-policy.md Sec 2.1 already describes, this just
      # removes the "someone has to remember to run it" step.
      #
      # `path:` points this action at PF_CHECKOUT rather than the
      # workflow's default working directory -- with no actions/checkout
      # step, ${{ github.workspace }} is an empty directory, not a git
      # repository at all.
      - name: Open drift PR
        if: steps.check.outcome == 'failure'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: ${{ env.PF_CHECKOUT }}
          branch: chore/connector-live-fixture-drift
          title: "chore: connector live fixture drift detected"
          commit-message: "Update recorded fixtures after provider API drift"
          body-path: /tmp/qa-record-report.md
          add-paths: tests/fixtures/live/**

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-live-check-report
          path: /tmp/qa-*-report.md
          retention-days: 90
