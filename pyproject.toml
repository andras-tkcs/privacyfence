[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyfence"
version = "3.4.0"
description = "Menu bar / tray privacy proxy between Claude (MCP) and your personal data (macOS, Windows)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Andras Takacs", email = "privacyfence@tkcs.name" }]
dependencies = [
    # Cross-platform -- no sys_platform marker needed, installs everywhere.
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "slack-sdk>=3.27.0",
    "telethon>=1.36.0",
    "atlassian-python-api>=3.41.0",
    "simple-salesforce>=1.12.0",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    # macOS: rumps.App (tray/menu bar) and the pyobjc frameworks
    # approval_window.py/dialog_window.py/settings_window.py build native
    # AppKit/WKWebView windows with (menu_bar.py). See tray_windows.py/
    # approval_window_windows.py/dialog_window_windows.py/
    # settings_window_windows.py for the Windows-only equivalents below --
    # issue #121. Every module importing one of these guards the import
    # (try/except ImportError, same pattern settings_controller.py already
    # used pre-#121 for its own rumps/dialog_window dependency), so
    # `pip install privacyfence` on the *other* platform never fails even
    # though these five packages themselves are never installed there.
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    # Windows: pystray (tray icon), pywebview (approval/dialog/settings
    # windows, via WebView2 -- pywebview's default Windows backend, which
    # additionally needs the WebView2 runtime itself; see
    # docs/windows-port-status.md) and Pillow (pystray's own icon-image
    # dependency, tray_windows.py loads the bundled PNG through it).
    "pystray>=0.19; sys_platform == 'win32'",
    "pywebview>=5.0; sys_platform == 'win32'",
    "Pillow>=10.0; sys_platform == 'win32'",
]

[project.scripts]
privacyfence-app = "privacyfence.daemon_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
privacyfence = [
    "resources/*.png",
    "resources/settings.yaml.example",
    "resources/connector_icons/*.png",
    "resources/connector_icons/README.md",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    # Official MCP Python client -- test-only, used solely by
    # tests/integration/test_bridge_daemon_contract.py to drive the real
    # Node bridge over real MCP-over-stdio. Never shipped in the daemon or
    # the bridge (see docs on dropping fastmcp/mcp from the MCP side).
    # Capped below 2.0: v2 (released 2026-07-28) removes ClientSession,
    # stdio_client, and StdioServerParameters in favor of a unified Client/
    # open_session() API and renames isError -> is_error, which would break
    # test_bridge_daemon_contract.py's imports outright. Bump the cap only
    # alongside a rewrite of that test's client-side calls.
    "mcp>=1.28,<2.0.0",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung asyncio socket test (e.g. a fixture never closing a connection)
# would otherwise block the whole suite indefinitely instead of failing.
timeout = 30
