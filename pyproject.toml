[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyfence"
dynamic = ["version"]
description = "Privacy proxy between Claude (MCP) and your personal data, with an embedded web approval/settings UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Andras Takacs", email = "info@privacyfence.eu" }]
dependencies = [
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "slack-sdk>=3.27.0",
    "telethon>=1.36.0",
    "atlassian-python-api>=3.41.0",
    "simple-salesforce>=1.12.0",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    # Embedded HTTP(S) server for the web approval surface (D10 in
    # docs/https-connector-refactor-plan.md §15: this stack is brought in
    # starting at P1, ahead of the MCP-over-HTTP endpoint itself, so
    # web/server.py isn't written twice against two different stacks).
    # Platform-independent -- installed everywhere, unlike the AppKit
    # dependencies above.
    #
    # Floor raised from 0.37 to 1.3.1 (SEC-19, Phase 2.4 in
    # docs/security-remediation-plan.md): every starlette release below
    # 1.3.1 has at least one of five CVEs pip-audit's dependency-audit.yml
    # gate found live in this repo's original <1.0-capped range.
    # PYSEC-2026-161/CVE-2026-48710 and PYSEC-2026-248/CVE-2026-54282 are
    # directly relevant here, not just theoretical: an unvalidated Host
    # header / request path can move `request.url`'s authority boundary,
    # and `web/session_auth.py::check_origin` and
    # `web/org_session.py::check_origin` both compare an incoming `Origin`
    # header against `request.url.scheme`/`.netloc` as defense-in-depth on
    # top of the CSRF double-submit token -- a corrupted `request.url`
    # could have made that comparison meaningless (not a full bypass on
    # its own, since the double-submit token is the primary check, but
    # exactly the kind of secondary control this bug would quietly
    # defeat). PYSEC-2026-249/CVE-2026-54283 (unbounded urlencoded form
    # parsing) and PYSEC-2026-2281/2280 (a Windows UNC-path SSRF and an
    # HTTPEndpoint verb-dispatch bypass, both StaticFiles/class-based-view
    # issues this app's own route functions don't use) are fixed by the
    # same bump regardless.
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.30,<1.0",
    # Official MCP Python SDK, promoted from a test-only dependency to a
    # runtime one at P2 (D2 in docs/https-connector-refactor-plan.md §15):
    # web/routes_mcp.py hosts the real Streamable HTTP MCP endpoint on it,
    # not just tests/integration/test_bridge_daemon_contract.py's client
    # side anymore. Capped below 2.0 for the same reason the test-only pin
    # originally was -- v2 (released 2026-07-28) removes ClientSession,
    # stdio_client and StdioServerParameters and renames isError ->
    # is_error, which would break that contract test's client-side imports
    # outright. Bump the cap only alongside a rewrite of that test and a
    # check of web/routes_mcp.py's own server-side surface against 2.0.
    "mcp>=1.28,<2.0.0",
    # Verifying the org IdP's ID token (P7, docs/https-connector-refactor-
    # plan.md §9.4: PrivacyFence is its own minimal OAuth 2.1 authorization
    # server, decision B in §15, authenticating the human against the org's
    # IdP by OIDC behind the scenes) means checking a JWT signature against
    # a JWKS endpoint -- the same "security-critical, spec-governed, don't
    # hand-roll it" reasoning D2 already gave for the MCP SDK itself
    # applies here. Already an undeclared transitive dependency of `mcp`
    # itself (and of simple-salesforce) as of this writing, so this adds no
    # new package to what's actually installed -- it just stops relying on
    # that being true by accident.
    "PyJWT>=2.8,<3.0",
    # WebAuthn step-up authentication for org-mode write approvals (P9,
    # docs/https-connector-refactor-plan.md §10.6, §15 D7): parsing CBOR
    # attestation objects and verifying COSE signatures is exactly the same
    # "security-critical, spec-governed, don't hand-roll it" case D2
    # already made for the MCP SDK -- see webauthn_stepup.py's own module
    # docstring.
    "webauthn>=3.0,<4.0",
    # Cross-platform single-instance file locking for daemon_main.py's
    # _acquire_instance_lock()/_release_instance_lock() (docs/windows-
    # support-plan.md Phase 1, B1 in docs/windows-linux-support-plan.md):
    # picks the right OS primitive itself (fcntl.flock on POSIX,
    # msvcrt/LockFileEx on Windows), the same "don't hand-roll a
    # platform-locking primitive" reasoning already given above for
    # PyJWT/webauthn. Not a platform-conditional extra -- it's a small,
    # pure-Python-plus-stdlib-ctypes library that's a no-op cost on every
    # platform, so every install gets it rather than branching the
    # dependency list by sys_platform.
    "portalocker>=2.8",
]

[project.scripts]
privacyfence-app = "privacyfence.daemon_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
privacyfence = [
    "resources/*.png",
    "resources/settings.yaml.example",
    "resources/connector_icons/*.png",
    "resources/connector_icons/README.md",
]

[project.optional-dependencies]
# P10 (docs/https-connector-refactor-plan.md §12, decision D6) deleted the
# native menu bar / AppKit approval and settings windows -- nothing in
# src/privacyfence/ imports any of these three any more. Kept as an
# optional extra, not dropped outright, purely because D6's own reasoning
# for deleting the native UI ("the ApprovalUI seam lets it come back if
# that proves wrong") means a future native implementation (e.g. a
# Windows-native dialog for #121) would want them back -- installing this
# extra is not required for anything this package does today.
macos-native = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
dev = [
    "pyinstaller>=6.0",
    # sdist/wheel build + local upload, for rehearsing a release by hand --
    # see the "Publishing to PyPI" section of CLAUDE.md. CI
    # (.github/workflows/publish-pypi.yml) installs `build` itself and
    # never needs twine: it uploads via pypa/gh-action-pypi-publish's OIDC
    # trusted-publishing flow, not a stored token, so nothing here signs
    # in as CI.
    "build>=1.2",
    "twine>=5.0",
    # Build-time-only PNG -> multi-resolution .ico conversion for the
    # Windows build (docs/windows-support-plan.md Phase 2.3): unlike
    # macOS's sips/iconutil (used by build_dmg.sh), there's no Windows-
    # native icon-conversion tool available cross-platform in CI, so
    # scripts/build_installer.ps1 does it with Pillow instead. Not a
    # runtime dependency -- mirrors how pyinstaller itself is dev-extra-
    # only above.
    "Pillow>=10.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    # The official MCP Python client used by
    # tests/integration/test_bridge_daemon_contract.py (real Node bridge
    # over real MCP-over-stdio) and tests/unit/web/test_routes_mcp.py (the
    # real /mcp Streamable HTTP endpoint over an in-process ASGI transport)
    # is `mcp` itself -- now a runtime dependency (see pyproject.toml's
    # [project.dependencies], P2/D2), not listed again here.
    "freezegun>=1.5",
    # starlette.testclient.TestClient's transport -- test-only, exercising
    # web/ routes (tests/unit/web/) without a real socket.
    "httpx>=0.27",
    # tests/integration/test_browser_smoke.py (TST-06, docs/security-
    # remediation-plan.md Phase 2 item 2.5) -- drives the real web approval
    # surface in a real headless browser, for the CSP/SameSite-cookie/SSE
    # behavior only a real browser actually enforces (see that module's own
    # docstring). Also needs a downloaded Chromium build (`playwright
    # install chromium`, see .github/workflows/tests.yml); the test module
    # skips itself if either is missing, so this alone doesn't force a
    # browser download on every `pip install -e ".[test]"`.
    "playwright>=1.48,<2.0",
]
# Static analysis gate (docs/security-remediation-plan.md, Phase 2 item 2.3,
# TST-07). ruff is the CI-blocking step ([tool.ruff.lint] below); mypy and
# bandit run in CI too but non-blocking for now -- see the comments on those
# tool sections for why.
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.setuptools_scm]
# The version is derived entirely from git tags now -- see this repo's
# CLAUDE.md "Releasing" section. A release tag looks like `vX.Y.Z` (stable)
# or `vX.Y.Z<a|b|rc><N>` (pre-release, PEP 440 short form, e.g. `v4.0.0a13`);
# setuptools_scm reads it via `importlib.metadata.version("privacyfence")`
# at runtime (see src/privacyfence/__init__.py). Between tags it synthesizes
# a `<next-version>.devN+g<sha>` version (e.g. `4.0.1.dev3+gabc1234`) -- that
# shape is what update_checker.py's parse_version() is built to accept, not
# just exact release tags.
#
# fallback_version only matters before this repo's very first tag exists
# (or if git/tag history is unavailable, e.g. a tarball with no .git/) --
# it's never a real shipped version, so it's deliberately not "4.0.0..."
# alpha-series-looking, to avoid being mistaken for one.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung asyncio socket test (e.g. a fixture never closing a connection)
# would otherwise block the whole suite indefinitely instead of failing.
timeout = 30

[tool.coverage.run]
# TST-03 (docs/security-remediation-plan.md Phase 2.1): branch coverage, not
# just line coverage, is what scripts/check_coverage_floor.py's floors are
# computed against -- a line that's always reached but whose "else" arm
# never runs (e.g. a fail-open branch nothing exercises) reads as fully
# covered under line-only coverage. `--cov-branch` on the CI/pre-release
# pytest invocations is redundant with this but kept explicit there so it's
# visible without opening this file.
branch = true
source = ["src/privacyfence"]

# --- Static analysis (docs/security-remediation-plan.md, Phase 2 item 2.3,
# TST-07) --- #

[tool.ruff]
target-version = "py311"
# Not tied to any rule in `select` below today (none of them care about
# width), but set for when line-length-sensitive rules get added.
line-length = 120

[tool.ruff.lint]
# Pinned explicitly rather than left at ruff's shifting default so a ruff
# upgrade can't silently turn on/off rules underneath CI. This is the
# "ruff blocking immediately" half of TST-07 -- E4/E7/E9 (syntax errors,
# obvious logic errors) and F (pyflakes: unused imports/names, undefined
# names) are the baseline the existing codebase already passes cleanly.
# Broadening this (import sorting, pyupgrade, bugbear, ...) is the
# "ongoing" half of TST-07's effort estimate -- each addition should land
# as its own change once the resulting diff has been reviewed, not folded
# in silently here.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
# TST-07: "mypy/pyright incrementally (non-blocking -> blocking per
# module)". The existing code predates type-checking in CI and mypy's
# default strictness currently finds ~87 pre-existing errors across ~20
# files (mostly connector wiring in daemon_main.py and a few Starlette/ASGI
# signature mismatches) -- none of them are new to this change, and fixing
# them all is out of this PR's scope (see CLAUDE.md /
# docs/security-remediation-plan.md's own "don't silently expand scope"
# note). CI runs mypy non-blocking for now (informational only) so those
# pre-existing errors are visible without failing every build; per-module
# `[[tool.mypy.overrides]]` blocks with `strict = true` (or just
# `warn_unused_ignores`/`disallow_untyped_defs` per-module) should be added
# here as modules get cleaned up and promoted to blocking.
ignore_missing_imports = true

[tool.bandit]
# TST-07: "bandit or semgrep for security-focused rules". Scans src/ only
# for now (tests/ trips B101 `assert_used` constantly, which is how pytest
# assertions work, not a finding) and runs non-blocking in CI alongside
# mypy: bandit currently flags two real, already-tracked issues (SEC-14,
# Phase 3 item 3.2 -- xml.etree.ElementTree on attachment content) plus a
# handful of low-severity false positives (constant names like
# `web_token`/`mcp_token` read as B105 "hardcoded password strings", an
# `assert` used for internal invariant-narrowing rather than input
# validation). Fixing SEC-14 here would be scope creep on this change;
# once it lands (Phase 3.2) and the false positives are triaged, this
# should move to blocking.
exclude_dirs = ["tests"]
