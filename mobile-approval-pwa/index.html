<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivacyFence Mobile Approval</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 1.5rem; min-height: 100vh; box-sizing: border-box;
    background: #111318; color: #e8e9ed;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.05rem; font-weight: 600; color: #9aa0ab; margin: 0 0 1.5rem; }
  fieldset { border: 1px solid #2a2d36; border-radius: 10px; padding: 1rem; margin: 0 0 1rem; }
  legend { padding: 0 0.4rem; color: #9aa0ab; font-size: 0.8rem; }
  label { display: block; font-size: 0.85rem; color: #9aa0ab; margin: 0.6rem 0 0.2rem; }
  input[type=text], textarea {
    width: 100%; box-sizing: border-box; background: #1a1d24; border: 1px solid #33363f;
    border-radius: 6px; color: #e8e9ed; padding: 0.5rem; font-size: 1rem; font-family: inherit;
  }
  textarea { min-height: 6rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  button {
    font-size: 1rem; padding: 0.6rem 1rem; border-radius: 8px; border: none;
    margin-top: 0.8rem; cursor: pointer; width: 100%;
  }
  button.primary { background: #3b82f6; color: white; }
  button.approve { background: #22c55e; color: #08210f; font-weight: 700; }
  button.deny { background: #ef4444; color: #250a0a; font-weight: 700; }
  button.secondary { background: #2a2d36; color: #e8e9ed; }
  #pending-card { border: 1px solid #33363f; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
  #pending-card .title { font-weight: 700; margin: 0 0 0.3rem; }
  #pending-card .connector { color: #9aa0ab; font-size: 0.8rem; margin: 0 0 0.6rem; text-transform: uppercase; }
  #pending-card .reason { font-size: 0.85rem; color: #c8ccd6; font-style: italic; }
  #pending-card .preview-row { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; padding: 0.2rem 0; border-bottom: 1px solid #22242b; }
  #pending-card pre.details {
    white-space: pre-wrap; word-break: break-word; background: #1a1d24; padding: 0.75rem;
    border-radius: 6px; font-size: 0.85rem; border: 1px solid #33363f; max-height: 40vh; overflow-y: auto;
  }
  .pii-banner {
    color: #ffb4b4; font-weight: 700; background: #3a1414; border: 1px solid #7a2626;
    border-radius: 8px; padding: 0.6rem 0.8rem; margin: 0 0 0.8rem;
  }
  #status { font-size: 0.85rem; color: #9aa0ab; margin-top: 1rem; }
  #bundle-warning {
    color: #ffb4b4; font-weight: 700; background: #3a1414; border: 1px solid #7a2626;
    border-radius: 8px; padding: 0.6rem 0.8rem; margin: 0 0 1rem; font-size: 0.85rem;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>PrivacyFence — Mobile Approval (issue #55)</h1>

  <div id="bundle-warning" class="hidden"></div>

  <section id="pair-screen">
    <fieldset>
      <legend>Pair with a relay</legend>
      <label for="pairing-payload">Pairing payload (from `privacyfence-app --pair-mobile-device`)</label>
      <textarea id="pairing-payload" placeholder='{"v": 1, "relay_url": "...", ...}'></textarea>
      <label for="device-name">This phone's name</label>
      <input type="text" id="device-name" placeholder="Alice's iPhone">
      <button class="primary" id="pair-button">Pair</button>
    </fieldset>
  </section>

  <section id="waiting-screen" class="hidden">
    <fieldset>
      <legend>Paired — waiting for a request</legend>
      <div id="connection-info"></div>
      <button class="secondary" id="forget-button">Forget pairing</button>
    </fieldset>
  </section>

  <section id="pending-screen" class="hidden">
    <div id="pending-card"></div>
    <button class="approve" id="approve-button">Approve</button>
    <button class="deny" id="deny-button">Deny</button>
  </section>

  <div id="status"></div>

  <script src="./js/x25519.js"></script>
  <script src="./js/crypto.js"></script>
  <script src="./js/pairing.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
